name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true


[observability]
enabled = true


[[d1_databases]]
binding = "db"
database_name = "cloudmail"
database_id = "a064f7b0-a469-4aef-9373-3e96e19919d8"


[[kv_namespaces]]
binding = "kv"
id = "a869f2df7a164c21bd25ac1b100e9ac0"


#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字


#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用


[ai]
binding = "ai"


[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true


[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效

